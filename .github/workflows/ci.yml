name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/interactive-ai-portfolio-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/interactive-ai-portfolio-web

jobs:
  validate-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install web dependencies
        run: npm install

      - name: Build web app
        run: npm run build --workspace @portfolio/web

  validate-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install API dependencies
        run: python -m pip install --upgrade pip && pip install -r apps/api/requirements.txt

      - name: Compile API package
        run: python -m compileall apps/api/app

  build-images:
    runs-on: ubuntu-latest
    needs:
      - validate-web
      - validate-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -f apps/api/Dockerfile .

      - name: Build Web image
        run: docker build -f apps/web/Dockerfile .

  publish-images:
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      api_image: ${{ env.API_IMAGE }}:${{ github.sha }}
      web_image: ${{ env.WEB_IMAGE }}:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # Dokploy Deploy — trigger redeploy via webhook setelah image push
  # ------------------------------------------------------------------
  deploy-dokploy:
    runs-on: ubuntu-latest
    needs: publish-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Trigger Dokploy API Redeploy
        run: |
          curl -sf -X POST "${{ secrets.DOKPLOY_API_WEBHOOK_URL }}" \
            -H "Authorization: ${{ secrets.DOKPLOY_API_WEBHOOK_TOKEN }}" \
            && echo "API redeploy triggered"

      - name: Trigger Dokploy Web Redeploy
        run: |
          curl -sf -X POST "${{ secrets.DOKPLOY_WEB_WEBHOOK_URL }}" \
            -H "Authorization: ${{ secrets.DOKPLOY_WEB_WEBHOOK_TOKEN }}" \
            && echo "Web redeploy triggered"