services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-your-org}/interactive-ai-portfolio-api:latest
    env_file:
      - .env
    environment:
      APP_NAME: Interactive AI Engineering Portfolio API
      APP_ENV: production
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  web:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-your-org}/interactive-ai-portfolio-web:latest
    env_file:
      - .env
    environment:
      APP_ENV: production
    ports:
      - "3001:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
