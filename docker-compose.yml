services:
  # --- PORTFOLIO & CADDY ---
  portfolio:
    build: .
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - portfolio

  # --- BASE INFRA ---
  rustfs_perms:
    image: alpine
    user: root
    volumes:
      - ./storage/rustfs:/fix_path
    command: chown -R 10001:10001 /fix_path

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs_server
    restart: always
    depends_on:
      rustfs_perms:
        condition: service_completed_successfully
    environment:
      - RUSTFS_ACCESS_KEY=adrian
      - RUSTFS_SECRET_KEY=adrian29042003
      - RUSTFS_CONSOLE_ENABLE=true
    volumes:
      - ./storage/rustfs:/data
    command: --address :9000 --console-enable /data

  db:
    image: pgvector/pgvector:pg16
    container_name: postgres_vector
    restart: always
    environment:
      POSTGRES_USER: adrian
      POSTGRES_PASSWORD: adrian29042003
      POSTGRES_DB: adrianfhr
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adrian -d adrianfhr"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_gui
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: adrian@local.com
      PGADMIN_DEFAULT_PASSWORD: adrian29042003
      PGADMIN_CONFIG_SERVER_MODE: 'True' # Ubah ke True
      PGADMIN_LISTEN_PORT: 80             # Paksa listen di port 80
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0  # <--- TAMBAHKAN BARIS INI

    depends_on:
      - db

  redis:
    image: redis:7-alpine
    container_name: redis_service
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data: